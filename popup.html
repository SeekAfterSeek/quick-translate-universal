<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { width: 320px; padding: 16px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #222; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { font-size: 13px; line-height: 1.6; margin: 8px 0; color: #444; }
    .kbd { background: #eee; border: 1px solid #ccc; border-radius: 4px; padding: 2px 6px; font-family: monospace; }
    a { color: #1a73e8; text-decoration: none; }
    label { display: block; font-size: 13px; margin: 10px 0 4px; }
    select { width: 100%; padding: 6px; font-size: 13px; }
    .tip { background: #f6f8fa; border-radius: 8px; padding: 10px; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h1>划词快译</h1>
  <p>在任意网页上 <b>选中文字</b>，然后单独按 <span class="kbd">L</span> 键（不带 Ctrl/Alt/Shift）即可弹出翻译。</p>
  <p>备用方式：也可按 <span class="kbd">Ctrl + Shift + L</span>（Mac 为 <span class="kbd">⌘ + Shift + L</span>）。</p>
  <p>想改备用快捷键？打开 <a id="shortcutLink" href="#" target="_blank">扩展快捷键设置页</a> 修改。</p>

  <label for="engine">翻译引擎</label>
  <select id="engine">
    <option value="mymemory">MyMemory（默认，国内可直连）</option>
    <option value="google">Google 翻译（质量更好，国内需代理）</option>
  </select>

  <label for="target">目标语言</label>
  <select id="target">
    <option value="zh-CN">中文（简体）</option>
    <option value="zh-TW">中文（繁体）</option>
    <option value="en">英语</option>
    <option value="ja">日语</option>
    <option value="ko">韩语</option>
    <option value="fr">法语</option>
    <option value="de">德语</option>
    <option value="ru">俄语</option>
    <option value="es">西班牙语</option>
  </select>

  <div class="tip" style="margin-top:12px;">
    浮层点别处或按 <span class="kbd">Esc</span> 关闭。<br/>
    主引擎失败时插件会自动尝试备用引擎。
  </div>

  <script src="browser-polyfill.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
